name: build
on: [push, workflow_dispatch]
jobs:
  agent:
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: windows-amd64, ext: .exe, flags: "-H=windowsgui" }
          - { os: ubuntu-latest,  name: linux-amd64,   ext: "",   flags: "" }
          - { os: macos-latest,   name: macos-arm64,   ext: "",   flags: "" }
          - { os: macos-13,       name: macos-amd64,   ext: "",   flags: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go build -trimpath -ldflags "-s -w ${{ matrix.flags }}" -o fernwartung-agent-${{ matrix.name }}${{ matrix.ext }} ./cmd/agent
      - uses: actions/upload-artifact@v4
        with: { name: agent-${{ matrix.name }}, path: fernwartung-agent-* }
